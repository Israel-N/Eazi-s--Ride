server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router: serve the SPA entry point for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite-generated assets are content-hashed and safe to cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
